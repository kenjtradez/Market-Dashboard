name: Build Market Dashboard

on:
  schedule:
    # Run at 07:30 UTC every weekday (roughly start of US/Europe morning)
    - cron: '30 7 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached data
        id: cache
        uses: actions/cache@v4
        with:
          path: data/
          key: fred-data-${{ github.run_id }}
          restore-keys: fred-data-

      - name: Fetch FRED macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py
        continue-on-error: true

      - name: Fetch options data from Yahoo Finance
        run: python scripts/fetch_options_yf.py
        continue-on-error: true

      - name: Extract OME data from screenshots (fallback if no yfinance data)
        run: python scripts/extract_ome.py
        continue-on-error: true

      - name: Compute scores
        run: python scripts/compute_scores.py

      - name: Calculate Vol & Range Forecast
        run: python scripts/calc_vol_range.py
        continue-on-error: true

      - name: Fetch economic calendar events
        run: python scripts/fetch_events.py
        continue-on-error: true

      - name: Fetch CFTC COT positioning
        run: python scripts/fetch_cot.py
        continue-on-error: true

      - name: Fetch Oanda live prices
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/fetch_oanda.py
        continue-on-error: true

      - name: Fetch geopolitical risk news
        run: python scripts/fetch_geopolitical.py
        continue-on-error: true

      - name: Compute news sentiment from GDELT articles
        run: python scripts/fetch_sentiment.py
        continue-on-error: true

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
