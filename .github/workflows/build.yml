name: Build Market Dashboard

on:
  schedule:
    # Briefs at 06:41 and 12:41 UK time. GitHub cron is UTC-only, so each brief
    # has a BST and a GMT cron and the "slot" step drops whichever one doesn't
    # match the current UK offset. Off-the-hour minutes because on-the-hour
    # schedules are the ones GitHub delays most.
    - cron: '41 5 * * 1-5'   # 06:41 BST
    - cron: '41 6 * * 1-5'   # 06:41 GMT
    - cron: '41 11 * * 1-5'  # 12:41 BST
    - cron: '41 12 * * 1-5'  # 12:41 GMT
    # Silent build at 10:09 UK so the Band Read captures the 10:00 checkpoint.
    - cron: '9 9 * * 1-5'    # 10:09 BST
    - cron: '9 10 * * 1-5'   # 10:09 GMT
    # Silent data refresh during US hours: Yahoo only publishes option open
    # interest while the US market is open, so this snapshot feeds the briefs.
    - cron: '23 18 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Send the Telegram brief'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Decide run type
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          MANUAL_SEND: ${{ inputs.send_telegram }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sched, event = os.environ["SCHEDULE"], os.environ["EVENT"]
          bst = datetime.now(ZoneInfo("Europe/London")).utcoffset().total_seconds() == 3600
          run, send = True, False
          if event == "schedule":
              hour = int(sched.split()[1])
              if hour in (5, 11):
                  run = send = bst
              elif hour in (6, 12):
                  run = send = not bst
              elif hour == 9:
                  run = bst
              elif hour == 10:
                  run = not bst
          elif event == "workflow_dispatch":
              send = os.environ.get("MANUAL_SEND") == "true"
          print(f"run={'true' if run else 'false'}")
          print(f"send={'true' if send else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.slot.outputs.run == 'true'

      - name: Set up Python
        if: steps.slot.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached data
        if: steps.slot.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: data/
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Run pipeline
        if: steps.slot.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/run_all.py

      - name: Upload Pages artifact
        if: steps.slot.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./

      - name: Deploy to GitHub Pages
        if: steps.slot.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send Telegram brief
        if: steps.slot.outputs.send == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/send_telegram.py
