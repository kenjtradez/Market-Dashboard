name: Build Market Dashboard

on:
  schedule:
    # Run at 07:30 UTC every weekday (roughly start of US/Europe morning)
    - cron: '30 7 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r market-dashboard/requirements.txt

      - name: Restore cached data
        id: cache
        uses: actions/cache@v4
        with:
          path: market-dashboard/data/
          key: fred-data-${{ github.run_id }}
          restore-keys: fred-data-

      - name: Fetch FRED macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python market-dashboard/scripts/fetch_fred.py
        continue-on-error: true

      - name: Extract OME data from screenshots
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python market-dashboard/scripts/extract_ome.py
        continue-on-error: true

      - name: Compute scores
        run: python market-dashboard/scripts/compute_scores.py

      - name: Build dashboard
        run: python market-dashboard/scripts/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: market-dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
