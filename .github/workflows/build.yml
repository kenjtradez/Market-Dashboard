name: Build Market Dashboard

on:
  schedule:
    # Weekdays 06:30 & 13:00 UK (winter: 06:30/13:00 UTC, summer BST: 07:30/14:00)
    - cron: '30 6 * * 1-5'
    - cron: '0 13 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached data
        id: cache
        uses: actions/cache@v4
        with:
          path: data/
          key: fred-data-${{ github.run_id }}
          restore-keys: fred-data-

      - name: Fetch FRED macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py
        continue-on-error: true

      - name: Fetch options data from Yahoo Finance
        run: python scripts/fetch_options_yf.py
        continue-on-error: true

      - name: Extract OME data from screenshots (fallback if no yfinance data)
        run: python scripts/extract_ome.py
        continue-on-error: true

      - name: Compute scores
        run: python scripts/compute_scores.py

      - name: Calculate Vol & Range Forecast
        run: python scripts/calc_vol_range.py
        continue-on-error: true

      - name: Fetch economic calendar events
        run: python scripts/fetch_events.py
        continue-on-error: true

      - name: Fetch CFTC COT positioning
        run: python scripts/fetch_cot.py
        continue-on-error: true

      - name: Fetch live prices via Yahoo Finance
        run: python scripts/fetch_oanda.py
        continue-on-error: true

      - name: Fetch geopolitical risk news
        run: python scripts/fetch_geopolitical.py
        continue-on-error: true

      - name: Fetch yesterday's max range projection
        run: python scripts/fetch_yesterday_range.py
        continue-on-error: true

      - name: Compute news sentiment from GDELT articles
        run: python scripts/fetch_sentiment.py
        continue-on-error: true

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="Market Dashboard updated — $PAGE_URL"
